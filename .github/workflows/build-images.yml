name: Build placeholder images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_images.py
      - .github/workflows/build-images.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pillow>=11.3"
      - run: python scripts/build_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git diff --cached --quiet || git commit -m "Add optimised placeholder photography for V2"
          git push
